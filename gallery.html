<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Tasnim | Image Gallery</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: Arial, sans-serif;
    background: #f9f9f9;
    padding: 30px;
  }
  h1 {
    text-align: center;
    color: #2d3436;
    margin-bottom: 25px;
  }
  h1 span { color: #6c5ce7; }

  .gallery {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 15px;
    max-width: 1000px;
    margin: 0 auto;
  }
  .gallery img {
    width: 100%;
    height: 200px;
    object-fit: cover;
    border-radius: 10px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    transition: transform 0.3s;
  }
  .gallery img:hover {
    transform: scale(1.05);
  }

  /* Responsive grid */
  @media (max-width: 900px) {
    .gallery { grid-template-columns: repeat(2, 1fr); }
  }
  @media (max-width: 500px) {
    .gallery { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

  <h1>Tasnim <span>Gallery</span></h1>

  <div class="gallery">
    <img src="https://picsum.photos/seed/tasnim1/400/300" alt="Gallery photo 1">
    <img src="https://picsum.photos/seed/tasnim2/400/300" alt="Gallery photo 2">
    <img src="https://picsum.photos/seed/tasnim3/400/300" alt="Gallery photo 3">
    <img src="https://picsum.photos/seed/tasnim4/400/300" alt="Gallery photo 4">
    <img src="https://picsum.photos/seed/tasnim5/400/300" alt="Gallery photo 5">
    <img src="https://picsum.photos/seed/tasnim6/400/300" alt="Gallery photo 6">
    <img src="https://picsum.photos/seed/tasnim7/400/300" alt="Gallery photo 7">
    <img src="https://picsum.photos/seed/tasnim8/400/300" alt="Gallery photo 8">
  </div>

</body>
</html>
