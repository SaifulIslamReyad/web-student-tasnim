<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Tasnim | Profile Card</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: Arial, sans-serif;
    background: #f0f2f5;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
  }
  .card {
    background: #ffffff;
    width: 300px;
    padding: 30px 20px;
    border-radius: 16px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.1);
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
  }
  .card img {
    width: 110px;
    height: 110px;
    border-radius: 50%;
    object-fit: cover;
    border: 4px solid #6c5ce7;
    margin-bottom: 15px;
  }
  .card h2 {
    color: #2d3436;
    font-size: 20px;
  }
  .card p.role {
    color: #6c5ce7;
    font-size: 14px;
    margin: 5px 0 15px;
  }
  .card p.bio {
    color: #636e72;
    font-size: 13px;
    line-height: 1.5;
    margin-bottom: 20px;
  }
  .card .btn {
    background: #6c5ce7;
    color: #fff;
    border: none;
    padding: 10px 25px;
    border-radius: 20px;
    font-size: 14px;
    cursor: pointer;
  }
  .card .btn:hover { background: #5849c2; }
  .brand {
    margin-top: 15px;
    font-size: 12px;
    color: #b2bec3;
  }
</style>
</head>
<body>

  <div class="card">
    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQTy-VXLLvHRgNWJgpXMMdqrv65XccG85PvfcA478mdvA&s=10" alt="Profile photo">
    <h2>Tasnim Ahmed</h2>
    <p class="role">Frontend Developer</p>
    <p class="bio">Loves building clean and simple web interfaces with HTML & CSS.</p>
    <button class="btn">Follow</button>
    <div class="brand">Tasnim.com</div>
  </div>

</body>
</html>
