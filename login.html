<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Tasnim | Login</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #74b9ff, #6c5ce7);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
  }
  .login-box {
    background: #fff;
    width: 320px;
    padding: 35px 30px;
    border-radius: 12px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    text-align: center;
  }
  .login-box h2 {
    color: #2d3436;
    margin-bottom: 5px;
  }
  .login-box p.sub {
    color: #b2bec3;
    font-size: 13px;
    margin-bottom: 25px;
  }
  .login-box input {
    width: 100%;
    padding: 12px;
    margin-bottom: 15px;
    border: 1px solid #dfe6e9;
    border-radius: 8px;
    font-size: 14px;
  }
  .login-box input:focus {
    outline: none;
    border-color: #6c5ce7;
  }
  .login-box button {
    width: 100%;
    padding: 12px;
    background: #6c5ce7;
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 15px;
    cursor: pointer;
  }
  .login-box button:hover { background: #5849c2; }
  .login-box .footer-text {
    margin-top: 15px;
    font-size: 13px;
    color: #636e72;
  }
  .login-box .footer-text a {
    color: #6c5ce7;
    text-decoration: none;
  }
</style>
</head>
<body>

  <div class="login-box">
    <h2>Tasnim</h2>
    <p class="sub">Login to your account</p>
    <form>
      <input type="email" placeholder="Email address" required>
      <input type="password" placeholder="Password" required>
      <button type="submit">Log In</button>
    </form>
    <p class="footer-text">Don't have an account? <a href="#">Sign up</a></p>
  </div>

</body>
</html>
